    dp_transfers:
      title: ""
      headings:
        main: ""
        destination_dp: ""
        source_dp: ""
      paragraphs:
        intro_html: |
          <p class="medium_paragraphs">
            This table shows which file transfers are allowed between Data Providers. Each cell of the table has two symbols, where %{ok} means <em>allowed</em> and %{no} means <em>not allowed</em>. Transfers will succeed if <strong>both</strong> symbols show up as %{ok}&nbsp;%{ok}.
          </p>
          <p class="medium_paragraphs">
            The first symbol indicates restrictions for transferring files between Data Provider pairs, independently of the states of any other resources. The restrictions are not necessarily symmetrical: it's possible to configure Data Providers A and B such that transfers from A &rarr; B are allowed (%{ok}) while transfers from B &rarr; A are not (%{no}).
          </p>
          <p class="medium_paragraphs">
            The second symbol takes into account three other factors:
            <ul>
              <li>whether or not Data Providers are <em>online</em> or <em>offline</em>;</li>
              <li>whether or not Data Providers are <em>read/write</em> or <em>read only</em>;</li>
              <li>whether or not the current Portal has itself access to each Data Provider.</li>
            </ul>
            In such cases, Data Providers will be annotated with %{offline}, %{read_only} and/or %{no_access}. If all three properties allow the file transfers, the second symbol will be %{ok}; otherwise it will be %{no}.
          </p>
