        ssh_dp: |
          <p class="medium_paragraphs">

            A SSH Data Provider connects to a UNIX server using SSH and
            transfers files back and forth using the 'rsync' command and sometimes
            other basic commands such as "mkdir", in a non-interactive mode. For this
            to work, you'll need to make sure that:

            <p>

            <ul>
              <li>The user account on the remote host has a 'clean shell'.<br>
              That means when login non-interactively, no messages
              are printed on stdout or stderr.<br>
              For more information, ask your sysadmin about this.
              <li>You've installed a SSH key in that account; see the panel at the bottom of this form.
              <li>The remote host is not behind a firewall or a two-Factor authentication mechanism.
            </ul>

