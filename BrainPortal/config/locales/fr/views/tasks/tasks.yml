      paragraphs:
        parameters_description_html: |
          <p class="medium_paragraphs">
           This shows only the scientific parameters associated with
           this task. See the description in the last panel for more
           information.
          </p>
        parameters_in_json: |
          <p class="medium_paragraphs">
           This shows only the scientific parameters associated with
           this task. See the description in the last panel for more
           information.
          </p>
        full_task_object_in_json_html: |
          <p class="medium_paragraphs">
            This structure shows the minimal amount of information needed
            to create a CBRAIN task similar to this one, using the CBRAIN API.
            This is provided to help developers working with the API. The top
            level contains the IDs of the CBRAIN resources needed for the task
            (e.g. the group (project) ID, the user's ID, the version of the
            tool etc). These are the values you see at the top of the page in
            the <em>Info</em> section.
          </p>
          <p class="medium_paragraphs">
            The information under <strong>"params"</strong> is exactly what
            is shown in the previous tab. It generally contains the scientific
            parameters for the tool, where file names are replaced by the IDs
            of files registered within CBRAIN.
          </p>
          <p class="medium_paragraphs">
            For tools integrated with
            <a href="https://github.com/boutiques/boutiques" target="_blank">Boutiques</a>,
            the <strong>"params"</strong> structure will contain a substructure called
            <strong>"invoke"</strong> where most of the scientific parameters are
            relocated. This structure should match exactly the invoke structure that
            the Boutiques program <em>bosh</em> expect, but again with filenames
            replaced by CBRAIN file IDs.
          </p>
          <p class="medium_paragraphs">
            Note that some keys and values are added to these structures during or
            at the end of processing and are not required at the time the task is
            submitted.
          </p>

