    provenance:
      title: "Provenance"

      headings:
        statement: "Déclaration de provenance de CBRAIN"

      paragraphs:
        statement_html: |
          Les nouvelles fonctionnalités et les corrections de bogues sont testées
          et intégrées à la branche de développement dès leur achèvement. 
          Des tests d'intégration continue sont exécutés de façon automatisée et
          s'appliquent à tout le code intégré au dépôt de développement. 
          Toutes les demandes d'extraction sont examinées et validées par l'équipe principale
          de développement avant d'être soit acceptées, soit retournées au développeur 
          auteur de la soumission afin qu'il puisse effectuer des modifications et des tests supplémentaires.     
          
          <p>
          
          Les versions majeures sont publiées afin de regrouper des ensembles 
          de corrections de bogues, de correctifs et de nouvelles fonctionnalités 
          jugés bénéfiques pour une diffusion sous la forme d'une version cumulative
          et intégrée destinée à la communauté. Les versions majeures sont préparées 
          par le développeur principal de CBRAIN et autorisées conjointement
          avec le directeur de l'équipe CBRAIN.
          
          <p>

          Each release contains an associated set of release notes documentation
          clearly identifying the new features and issues that are addressed
          within a given release.

          <p>

          <a href="https://github.com/aces/cbrain/blob/master/Release-Notes.md">Release Notes</a>
          are available in the CBRAIN GitHub repository.

          <p>

      footer:
        last_updated_html: ""

    report:
      title: ""

      headings:
        main: ""

      paragraphs:
        steps_html: |
          <p class="medium_paragraphs">
          This form allows you to generate many different kind of reports
          in a tabular layout. Proceed as follow:
          </p>

          <ul>
            <li><strong>Select the type of report</strong> in the grey box. Most reports
                will count the number of objects accessible to you, but some of them
                will perform summation of some attributes.
            </li>
            <li><strong>Click on "Lookup columns and rows"</strong> and the form will be adjusted
                to show you which attributes you can select for the rows and columns of
                your table.
            </li>
            <li><strong>Select an attribute for the rows and columns</strong> using each of the selection
                boxes shown at the top and left of the table area.
            </li>
            <li><strong>Click on "Generate Report"</strong> and the table will be created with
                hot links to the appropriate index pages for your objects. You can
                modify the report's properties and regenerate it anew any time you want.
            </li>
          </ul>

