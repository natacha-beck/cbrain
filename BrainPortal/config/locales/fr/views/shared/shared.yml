        ip_whitelist_html: |
          <div class="field_explanation">
            Liste d'adresses IP sources autorisées, séparées par des virgules (format X.X.X.X/XX) depuis lesquelles l'utilisateur peut se connecter.
          </div>
        allowed_globus_provider_names_html: |
          <div class="field_explanation">
            Si défini, doit être une liste de noms de fournisseurs d'identité OpenID séparés par des virgules. Un seul '*' est également autorisé pour signifier n'importe quel fournisseur.
          </div>
        zenodo_sandbox_token_html: |
          <div class="wide_field_explanation">
            Ce jeton peut être utilisé pour créer des dépôts de données Zenodo <strong>temporaires/de test</strong>.<p>
            Vous pouvez créer un jeton sur <a href="https://sandbox.zenodo.org/account/settings/applications/" target="_blank">https://sandbox.zenodo.org/account/settings/applications/</a>.
          </div>
        zenodo_main_token_html: |
          <div class="wide_field_explanation">
            Ce jeton peut être utilisé pour créer des dépôts Zenodo <strong>réels, officiels et permanents</strong>.<p>
            Vous pouvez créer un jeton sur <a href="https://zenodo.org/account/settings/applications/" target="_blank">https://zenodo.org/account/settings/applications/</a>.
          </div>
      prompts:
        select_site: "(Sélectionner un site)"
      no_orcid: "(Aucune identité ORCID liée à votre compte)"
      orcid_note_html: "<strong>Remarque :</strong> Utilisez le %{link} pour gérer le lien d'identité ORCID"
