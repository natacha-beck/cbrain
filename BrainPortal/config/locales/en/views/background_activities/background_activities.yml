      p:
        intro_html: 'This page shows "background activities" as progress bars. Each activity applies a single operation to a set of things (usually, files or tasks). These activities are often the result of clicking on buttons in other pages, when you get a message that <em>something was started in background</em>. Activities that are in progress are shown with glowing borders. Individual operations within an activity can succeed or fail. Sometimes, the failure is not significant (e.g. trying to compress a file that is already compressed).'
        cancel_note: "You can cancel activities, but remember that cancelled activities can never be restarted. You will have to redo whatever operation created the activity."
        cleanup_note: 'Older, finished "background activities" are generally cleaned up after one week and will disappear from this list.'
        admin_note: "As an admin, you can create maintenance activities that can be scheduled for later. See the accompanying form for more help. You can also suspend activities; these are resumable. You can suspend activities that are in progress, or scheduled in the future."
        refresh_note_html: "The progress bars in this page are <strong>not live</strong>, so you need to click the <em>Refresh</em> button to get an update on the progress of your activities."
