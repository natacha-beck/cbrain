      p_header_table_description: "Table Description"
      p_description_intro_html: "This is a <em>very wide</em> report table. It contains resource usage records for disk space and time consumed. Feel free to hide columns using the <strong>+</strong> menu at the right side of the main table header."
      p_description_space_userfile_html: "It displays the <span style='color: green'>changes of the sizes</span> of all the files, existing as well as deleted."
      p_description_cputime_html: "It displays the <span style='color: green'>CPU time</span> accumulated by tasks."
      p_description_walltime_html: "It displays the <span style='color: green'>'wall' time</span> accumulated by tasks."
      p_description_space_task_html: "It displays the <span style='color: green'>disk space</span> in the work directory, as well as the <span style='color: green'>final status</span> of past tasks. The disk space is not garanteed to be accurate, as this is a expensive resource to compute and is only provided FYI. The real, main purpose of this report is to gather statistics about the final <strong>status</strong> of tasks."
      p_description_cached_html: "Columns labeled <strong>Cached</strong> record pieces of information about resources <em>as they were at the time the record was made</em>. If a resource was destroyed (e.g. a non-<strong>Cached</strong> column is empty), these stay behind and provide filtering options. It makes it possible to gather statistics about these deleted resources."

