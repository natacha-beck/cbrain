    show_cpu_quota:
      title_create: "Create CPU Quota"
      title_edit: "Edit CPU Quota"
      cpu_quotas_table: "CPU Quotas Table"
      new_cpu_quota: "New CPU Quota"
      header_record: "CPU Quota Record"
      any_project: "(Any Project)"
      any_execution_server: "(Any Execution Server)"
      field_explanation_user: "You can leave the user field blank and instead specify a project, below. You can also leave them both blank."
      field_explanation_project: "Instead of specifying a user, above, you can select a project, and the quota will apply to all users of that project. User and Project are mutually exclusive in a CPU quota. You can also leave them both blank."
      field_explanation_execution_server: "You can leave this blank, but then you must provider either a user or a project, above."
      header_max_cpu_week: "Max CPU time past week"
      header_max_cpu_month: "Max CPU time past month"
      header_max_cpu_total: "Max CPU time in total"
      header_max_active_tasks: "Max Active Tasks"
      field_explanation_max_cpu_week_html: "The limit CPU time is in seconds; when entering a new value, you can use a unit as a suffix, such as in <em>3.5h</em> (hours), <em>7d</em> (days), <em>4w</em> (weeks), <em>3m</em> (months) and <em>1y</em> (years). There are no suffixes for seconds and minutes. A value of <em>0</em> means no time is allowed at all."
      field_explanation_see_week: "See the explanations for Max CPU time past week."
      field_explanation_max_active_tasks: "The maximum number of tasks that can be active at any given time on the Execution Server. Leave blank to not set a limit. A value of zero will prevent any tasks from being launched. Note that projects are ignored for these values, and that if several quota records apply to a user and differ only by project, the minimum value found in that set will be used. The core Admin account is used to set a maximum number of tasks IN TOTAL for an Execution server (thus, no limit specific to that admin user can be specified here)."
      log_title: "CPU Quota Record Log"

    show_disk_quota:
      title_create: "Create Disk Quota"
      title_edit: "Edit Disk Quota"
      disk_quotas_table: "Disk Quotas Table"
      new_quota_same_user: "New Quota With Same User"
      new_quota_same_provider: "New Quota With Same Provider"
      header_record: "Disk Quota Record"
      blank_select_data_provider: "(Select a DataProvider)"
      header_max_disk_space: "Max Disk Space"
      header_max_num_files: "Max Number Of Files"
      field_explanation_max_bytes_html: "Sizes are in bytes; when entering a new value, you can use a unit as a suffix, such as in <em>2.3 kb</em> and <em>10 G</em>. A value of <em>0</em> means no files allowed at all."
      field_explanation_max_files_html: "A value of <em>0</em> means no files allowed at all."
      log_title: "Disk Quota Record Log"

    index:
      title: "%{mode} Quotas Configurations"
      mode:
        disk: "Disk"
        cpu: "CPU"
      about: "About"
      exceeded_report: "Exceeded %{mode} Quotas Report"
      new_entry: "New %{mode} Quota Entry"
      switch_to_disk: "Switch to Disk Quotas"
      switch_to_cpu: "Switch to CPU Quotas"
      header_about_disk: "About Disk Quotas"
      about_disk_html: "This page shows the limits for the amount of disk space and number of files that can be stored on each DataProvider. Each row is a quota entry that applies to a user or all users, for a particular DataProvider. When a user exceeds the one of the two limits for a DataProvider, the user will no longer be able to create new files."
      header_about_cpu: "About CPU Quotas"
      about_cpu_p1_html: "This page shows the limits for the amount of CPU processing time that a user can historically accumulate. There are three rolling windows: for the CPU time accummulated over the past week, over the past month, and over the entire lifetime of the user's account."
      about_cpu_p2_html: "Each row contains a quota entry with all three limits. Quotas can apply to one or several Execution Servers, and can apply to a single specific user, all users, or all the users of a particular project."
      about_cpu_p3_html: "When a user has exceeded their quota on an Execution Server, their tasks in status 'New' will not be set up, and they will stay in 'New' until the quota window has moved ahead far enough to free some time."

