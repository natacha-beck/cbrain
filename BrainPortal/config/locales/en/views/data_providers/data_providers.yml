    dp_transfers:
      title: "Transfer Restrictions"
      heading: "Data Provider Transfer Restrictions Report"
      intro_html: "This table shows which file transfers are allowed between Data Providers. Each cell of the table has two symbols, where %{ok} means <em>allowed</em> and %{no} means <em>not allowed</em>. Transfers will succeed if <strong>both</strong> symbols show up as %{ok}&nbsp;%{ok}."
      first_symbol_html: "<strong>First symbol</strong>: This one indicate restrictions for transferring files between Data Provider pairs, independently of the states of any other resources. The restrictions are not necessarily symmetrical: it's possible to configure Data Providers A and B such that transfers from A &rarr; B are allowed (%{ok}) while transfers from B &rarr; A are not (%{no})."
      second_symbol_html: "<strong>Second symbol</strong>: Since transfers are performed by a CBRAIN Portal, there are three other factors to take into account:"
      whether:
        online: "whether or not Data Providers are <em>online</em> or <em>offline</em>;"
        mode: "whether or not Data Providers are <em>read/write</em> or <em>read only</em>;"
        access: "whether or not the current Portal has itself access to each Data Provider."
      annotations_html: "In such cases, Data Providers will be annotated with %{offline}, %{read_only} and/or %{no_access}. If all three properties allow the file transfers, the second symbol will be %{ok}; otherwise it will be %{no}."
      offline: "(offline)"
      read_only: "(read only)"
      no_access: "(portal has no access)"
      destination_dp: "Destination Data Provider"
      source_dp: "Source Data Provider"
      legend_title: "Copying or moving files:"
