    register_button:
      button: "Register Files"
      explanation_html: "This panel allows you to <strong>register</strong> files that are present on the remote Data Provider, but not yet known by the CBRAIN interface. Once registered, a file will be visible in the <strong>Files</strong> manager, and can be used for launching tasks."
      recommendation_html: "We recommand that you use this Data Provider only to transfer data in and out of CBRAIN. When registering files, as you can see below, you can have them automatically moved or copied to another official CBRAIN Data Provider."
      must_move_html: "<strong>In fact, this particular Data Provider leaves you no choice</strong> and you MUST select another Data Provider where your files will be copied or moved."
      cleanup_html: "Once files are copied to another official Data Provider, we recommand you clean up the files here using the <strong>Delete Files</strong> panel, further right."
      when_registering_html: "<strong>When registering, automatically...</strong>"
      assign_project: "&darr; ... assign them to project ... &darr;"
      move_or_copy: "&darr; ... move or copy them ... &darr;"
      to: "&darr; ... to ... &darr;"
      info: "(info)"
      submit: "Register the files!"
      select_project: "(Select a project)"
      move_option: "... MOVE the files to Data Provider ->"
      copy_option: "... COPY the files to Data Provider ->"
      do_nothing: "... do nothing else!"
      select_another_dp: "(Select another Data Provider)"
      notes:
        title_html: "<strong>Important notes about automatically copying and moving files:</strong>"
        start: "The MOVE or COPY operation will start in background as soon as you click 'Register files'."
        no_modify: "While the operation is in progress, do not modify the files on the remote Data Provider!"
        copy_progress_html: "<strong>While a COPY operation is in progress</strong>, there will seem to be two registered versions of the file in the file manager (one on each Data Provider)."
        copy_done_html: "<strong>After a COPY operation is done</strong>, the files will still be visible here and will no longer seem to be registered."
        move_done: "After a MOVE operation is done, the files will have been erased from here."
        ignored: "Attempts to COPY or MOVE files to Data Providers where identically named files already exist will be ignored silently."

    show_user_key:
      instructions_title: "SSH Key Configuration Instructions"
      intro: "The box below shows your personal, public SSH key that the CBRAIN system will use to connect to your Data Provider. It is one line of text that needs to be installed in your home directory on the remote host you configured for your Data Provider."
      experts_html: "<Strong>For experts:</strong> if you are already familiar with this type of setup, you can simply cut-and-paste the key with a text editor in the file <em>.ssh/authorized_keys</em> on the remote system. Make sure permissions on the folder <em>.ssh</em> are 'rwx------' and on the file <em>authorized_keys</em> are 'rw-------'."
      newcomers_html: "<Strong>For newcomers:</strong> consider downloading the key using the link below and saving it as a file 'mykey.pub' on your current computer (or any computer). Then in a bash shell, run the 'ssh-copy-id' command as explained below and it will automatically connect to the remote host and install the key for you. The full command is:"
      no_security_risk: "Note that revealing this key's content to other people causes no security risks. The information in this key is meant to be public and people cannot use it to access your information."
      your_key_title: "Your Personal CBRAIN Public SSH Key"
      error_fetching: "Error fetching public key"
      download_link: "Download link:"

    unregister_button:
      button: "Unregister Files"
      explanation_html: "This panel allows you to <strong>unregister</strong> files that are present on the remote Data Provider and have already been registered by the CBRAIN interface. Once unregistered, a file will be no longer be visible in the <strong>Files</strong> manager, but will still be left on the disk at the remote site. It will be your responsibility to delete the data manually if you have an external access to the remote files, or you can use the <strong>Delete Files</strong> panel, further right."
      submit: "Unregister the files!"

